[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onboarding-map"
version = "0.1.0"
description = "New Member Onboarding Map: turn a GitHub repo into a reviewed onboarding map."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Claude API (costs money)"]
addopts = "-m 'not live'"
